# Smart Dukan 2.0 — Local Dev Environment
# Starts: PostgreSQL 16, Redis 7, MinIO (S3), Mailpit (SMTP)

services:
  postgres:
    image: postgres:16-alpine
    container_name: sd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartdukan
      POSTGRES_PASSWORD: smartdukan_dev
      POSTGRES_DB: smartdukan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdukan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sd_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass smartdukan_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "smartdukan_redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sd_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartdukan
      MINIO_ROOT_PASSWORD: smartdukan_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: sd_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
